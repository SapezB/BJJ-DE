version: 2

# Try using these source definitions instead!
sources:
  - name: fighters_raw
    database: "bjj_db"
    schema: "fighters_raw"
    description: Fighter data for BJJ athletes
    tables:
      - name: fighters
        description: One record per fighter, with their personal information and stats.
        columns:
          - name: name
            description: Full name of the fighter.
          - name: nickname
            description: Nickname of the fighter, if any.
          - name: weight_class_name
            description: Weight class of the fighter.
          - name: wins
            description: Total number of wins for the fighter.
          - name: losses
            description: Total number of losses for the fighter.
          - name: draws
            description: Total number of draws for the fighter.
          - name: weight_kgs
            description: Weight of the fighter in kilograms.
          - name: weight_lbs
            description: Weight of the fighter in pounds.
          - name: fav_technique
            description: The fighter's favorite technique or move.
          - name: team
            description: The team the fighter belongs to.
          - name: belt_under
            description: The belt rank of the fighter's instructor.